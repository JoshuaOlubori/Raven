[project]
name = "app"
version = "0.1.0"
description = "Dental Clinic Appointment Tracker — backend service"
readme = "README.md"
authors = [
    { name = "Joshua", email = "joshua.olubori@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    # Core web framework & ASGI server
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.30.0",
    # Validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.2.0",
    # Security
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.1",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

# ---------------------------------------------------------------------------
# Ruff — linting & formatting (Quality gates #1 and #2)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "Q",      # flake8-quotes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

# ---------------------------------------------------------------------------
# mypy — strict type checking (Quality gate #3)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src"]

# ---------------------------------------------------------------------------
# pytest — test suite (Quality gate #4)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3.0"
testpaths = ["tests"]
asyncio_mode = "auto"
