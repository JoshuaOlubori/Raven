# Alembic configuration for Dental Clinic Appointment Tracker
# Place this file in the backend/ directory alongside pyproject.toml

[alembic]
# Template for migration scripts
script_location = alembic

# Use the async SQLAlchemy URL from the application settings
# This will be overridden at runtime via the env.py
sqlalchemy.url = sqlite+aiosqlite:///./app.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S